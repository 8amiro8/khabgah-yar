<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خوابگاه‌یار هوشمند | سامانه اتوماسیون نظافت واحد</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فونت فارسی وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- تقویم شمسی JalaliDatePicker -->
    <link rel="stylesheet" href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">
    <script type="text/javascript" src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html, body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            padding-bottom: 95px;
            -webkit-tap-highlight-color: transparent;
        }
        input, select, textarea { font-size: 16px !important; }
        .app-card { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08); width: 100%; box-sizing: border-box; }
        jdp-container { z-index: 99999 !important; max-width: 94vw !important; font-family: 'Vazirmatn', sans-serif !important; }
    </style>
</head>
<body class="min-h-screen">

    <!-- 🔒 صفحه قفل و احراز هویت اختصاصی واحد -->
    <div id="authOverlay" class="fixed inset-0 z-[100] bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="app-card max-w-sm w-full p-6 rounded-3xl border border-indigo-500/40 shadow-2xl space-y-5 text-center">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-3xl mx-auto shadow-inner">🔐</div>
            <div>
                <h2 class="text-base sm:text-lg font-black text-white">ورود به پنل اختصاصی واحد</h2>
                <p class="text-[11px] text-slate-400 mt-1">هر واحد فقط به برنامه نظافت و اعضای خود دسترسی دارد</p>
            </div>
            <div class="grid grid-cols-2 gap-1 bg-slate-900 p-1 rounded-xl text-xs font-bold">
                <button type="button" onclick="switchAuthMode('login')" id="authTabLogin" class="py-2.5 rounded-lg bg-indigo-600 text-white transition">ورود به واحد</button>
                <button type="button" onclick="switchAuthMode('register')" id="authTabRegister" class="py-2.5 rounded-lg text-slate-400 transition">ثبت واحد جدید</button>
            </div>
            <div class="space-y-3 text-right">
                <div>
                    <label class="text-xs text-slate-300 font-bold block mb-1">شماره یا کد واحد:</label>
                    <input type="text" id="authRoomInput" placeholder="مثلاً: 402" dir="ltr" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-center font-bold outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-300 font-bold block mb-1">رمز عبور واحد (PIN):</label>
                    <input type="password" id="authPinInput" placeholder="••••" dir="ltr" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-center font-bold tracking-widest outline-none focus:border-indigo-500">
                </div>
                <p id="authErrorMsg" class="hidden text-xs text-rose-400 font-bold text-center bg-rose-500/10 p-2.5 rounded-xl border border-rose-500/30 leading-relaxed"></p>
            </div>
            <button type="button" onclick="handleRoomAuth()" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-xl text-xs shadow-lg transition">🚀 ورود به پنل واحد</button>
        </div>
    </div>

    <!-- 🔔 نوار اعلان Toast -->
    <div id="toast" class="fixed top-3 left-3 right-3 z-50 hidden max-w-md mx-auto">
        <div id="toastInner" class="bg-slate-900 border border-indigo-500 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2.5">
            <span id="toastIcon" class="text-lg shrink-0">✨</span>
            <span id="toastText"></span>
        </div>
    </div>

    <!-- 🧭 هدر اپلیکیشن -->
    <header class="app-card sticky top-0 z-40 px-3.5 py-2.5 border-b border-slate-800">
        <div class="max-w-xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-base shrink-0 shadow-md">🧹</div>
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-black text-xs sm:text-sm text-white truncate">خوابگاه‌یار</h1>
                        <span id="currentRoomDisplay" class="text-[10px] bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded-md font-bold border border-indigo-500/30">---</span>
                        <button onclick="logoutRoom()" class="text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-md font-bold">خروج 🔒</button>
                    </div>
                    <select id="spacePresetSelect" onchange="changeSpacePreset()" class="bg-transparent text-[10px] text-slate-400 font-bold outline-none cursor-pointer truncate max-w-[190px] block mt-0.5">
                        <option value="full_suite" class="bg-slate-900 text-white">🏠 واحد کامل</option>
                        <option value="single_room" class="bg-slate-900 text-white">🛏️ اتاق مشترک</option>
                    </select>
                </div>
            </div>
            <button onclick="loadCloudData(true)" class="bg-slate-800 text-indigo-300 border border-slate-700 px-2.5 py-2 rounded-xl text-[11px] font-bold flex items-center gap-1"><span>🔄</span><span>بروزرسانی</span></button>
        </div>
    </header>

    <!-- کانتینر اصلی -->
    <main class="max-w-xl mx-auto px-3 pt-3 space-y-3.5">
        <!-- تب ۱: برنامه نظافت -->
        <section id="view-board" class="space-y-3.5">
            <div class="app-card p-3.5 rounded-2xl">
                <div class="flex justify-between items-center mb-2.5">
                    <h2 class="font-bold text-xs text-white"><span>⏳</span> وضعیت نوبت اعضای واحد</h2>
                    <span class="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-md font-bold">قرمز = نوبت رسیده</span>
                </div>
                <div id="cycleBar" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
            </div>

            <div class="app-card p-3.5 rounded-2xl border-t-4 border-t-indigo-500 space-y-2.5">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">📌 نوبت‌های ثبت‌شده در صف انجام</h3>
                    <span id="todoCount" class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="todoContainer" class="space-y-2.5"></div>
            </div>

            <div class="app-card rounded-2xl overflow-hidden border border-indigo-500/30">
                <button type="button" onclick="toggleDrawer('newSlotDrawer', 'newSlotDrawerIcon')" class="w-full p-3.5 bg-indigo-950/30 flex justify-between items-center text-right">
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-black flex items-center justify-center text-base">+</span>
                        <span class="font-bold text-xs md:text-sm text-white">ثبت زمان خالی جدید برای نظافت</span>
                    </div>
                    <span id="newSlotDrawerIcon" class="text-indigo-300 text-xs font-bold">▼ باز کردن</span>
                </button>
                <div id="newSlotDrawer" class="hidden p-4 border-t border-slate-800 space-y-3.5">
                    <div>
                        <label class="text-xs text-slate-300 font-bold block mb-1">۱. انتخاب نام عضو:</label>
                        <select id="memberSelect" onchange="suggestNextAreaForMember()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white outline-none"></select>
                    </div>
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2">
                        <label class="text-xs text-indigo-300 font-bold block">۲. محل نظافت:</label>
                        <select id="areaSelect" class="w-full bg-slate-950 border border-indigo-500/40 rounded-xl p-2.5 font-bold text-emerald-400 outline-none"></select>
                    </div>
                    <div class="space-y-2.5 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                        <label class="text-xs text-slate-300 font-bold block">تاریخ و ساعت (۲۴ ساعته):</label>
                        <input type="text" id="dateInput" data-jdp placeholder="📅 انتخاب تاریخ..." readonly class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-center font-bold outline-none cursor-pointer">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="startTimeInput" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 font-bold text-white text-center outline-none"></select>
                            <select id="endTimeInput" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 font-bold text-white text-center outline-none"></select>
                        </div>
                    </div>
                    <button onclick="handleTaskSubmission()" class="w-full bg-indigo-600 text-white font-black py-3 rounded-xl text-xs shadow-lg">🚀 ثبت در جدول نوبت‌ها</button>
                </div>
            </div>
        </section>

        <!-- تب ۲: اعضا و اتاق‌ها -->
        <section id="view-members" class="hidden space-y-3.5">
            <div class="app-card rounded-2xl overflow-hidden border border-indigo-500/30">
                <button type="button" onclick="toggleDrawer('addMemberDrawer', 'addMemberDrawerIcon')" class="w-full p-3.5 bg-indigo-950/30 flex justify-between items-center text-right">
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-black flex items-center justify-center text-base">+</span>
                        <span class="font-bold text-xs md:text-sm text-white">افزودن عضو جدید به واحد</span>
                    </div>
                    <span id="addMemberDrawerIcon" class="text-indigo-300 text-xs font-bold">▼ باز کردن</span>
                </button>
                <div id="addMemberDrawer" class="hidden p-4 border-t border-slate-800 space-y-3.5">
                    <div>
                        <label class="text-xs text-slate-300 font-bold block mb-1">نام و نام خانوادگی:</label>
                        <input type="text" id="memberNameInput" placeholder="مثلاً: علی رضایی" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs text-slate-300 font-bold block">محل خواب:</label>
                        <div id="sleepZoneButtonsGrid" class="grid grid-cols-3 gap-2 text-xs"></div>
                    </div>
                    <button onclick="addMember()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs">+ ثبت عضو در واحد</button>
                </div>
            </div>

            <div class="app-card p-3.5 rounded-2xl space-y-2.5">
                <h3 class="font-bold text-xs md:text-sm text-white">👥 اعضای این واحد (<span id="membersCountBadge">0</span> نفر)</h3>
                <div id="membersGrid" class="grid grid-cols-2 gap-2"></div>
            </div>
        </section>

        <!-- تب ۳: امتیاز و پاداش -->
        <section id="view-ranking" class="hidden space-y-4">
            <div class="app-card p-3.5 rounded-2xl border-t-4 border-t-emerald-500 space-y-3">
                <h3 class="font-bold text-sm text-white">⭐ تایید و ثبت امتیاز نظافت‌ها</h3>
                <div id="doneContainer" class="space-y-2.5"></div>
            </div>
            <div class="app-card p-3.5 rounded-2xl border-t-4 border-t-amber-500 space-y-3">
                <h2 class="font-bold text-sm text-white">🏆 جدول رتبه‌بندی واحد</h2>
                <div id="rankingList" class="space-y-2.5"></div>
            </div>
        </section>
    </main>

    <!-- منوی پایین موبایل -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-3 py-2 z-40">
        <div class="max-w-xl mx-auto grid grid-cols-3 gap-2">
            <button onclick="switchTab('board')" id="tab-board" class="py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold flex flex-col items-center gap-0.5 transition shadow-lg"><span>📋</span><span>نوبت‌ها</span></button>
            <button onclick="switchTab('members')" id="tab-members" class="py-2 rounded-xl text-slate-400 text-xs font-bold flex flex-col items-center gap-0.5 transition"><span>👥</span><span>اعضا</span></button>
            <button onclick="switchTab('ranking')" id="tab-ranking" class="py-2 rounded-xl text-slate-400 text-xs font-bold flex flex-col items-center gap-0.5 transition"><span>🏆</span><span>امتیازات</span></button>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://faeysshpitmqbqpijtyi.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_ak3uAyt9OxzspXyblRZgsw_tLJpiiC-'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let CURRENT_ROOM = null;
        let authMode = 'login';
        let currentPreset = 'full_suite';
        const VALID_ZONES = ["اتاق ۱", "اتاق ۲", "پذیرایی"];
        let selectedSleepZone = "اتاق ۱";

        let members = [];
        let tasks = [];

        jalaliDatepicker.startWatch();

        function switchAuthMode(mode) {
            authMode = mode;
            document.getElementById('authErrorMsg').classList.add('hidden');
            if (mode === 'login') {
                document.getElementById('authTabLogin').className = "py-2.5 rounded-lg bg-indigo-600 text-white transition";
                document.getElementById('authTabRegister').className = "py-2.5 rounded-lg text-slate-400 transition";
                document.getElementById('authSubmitBtn').innerText = "🚀 ورود به پنل واحد";
            } else {
                document.getElementById('authTabRegister').className = "py-2.5 rounded-lg bg-emerald-600 text-white transition";
                document.getElementById('authTabLogin').className = "py-2.5 rounded-lg text-slate-400 transition";
                document.getElementById('authSubmitBtn').innerText = "✨ ساخت واحد جدید و ورود";
            }
        }

        async function handleRoomAuth() {
            const roomInput = document.getElementById('authRoomInput').value.trim().toLowerCase();
            const pinInput = document.getElementById('authPinInput').value.trim();
            const errEl = document.getElementById('authErrorMsg');
            errEl.classList.add('hidden');

            if (!roomInput || !pinInput) {
                errEl.innerText = "⚠️ لطفاً شماره واحد و رمز عبور را وارد کنید!";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                const { data: unitData, error } = await supabaseClient.from('units').select('*').eq('room_id', roomInput).maybeSingle();
                if (error) throw error;

                if (authMode === 'register') {
                    if (unitData) {
                        errEl.innerText = "⛔ این شماره واحد قبلاً ثبت شده است!";
                        errEl.classList.remove('hidden');
                    } else {
                        await supabaseClient.from('units').insert([{ room_id: roomInput, pin_code: pinInput, preset: 'full_suite' }]);
                        await unlockDashboard(roomInput, pinInput, 'full_suite');
                    }
                } else {
                    if (!unitData || String(unitData.pin_code) !== String(pinInput)) {
                        errEl.innerText = "⛔ شماره واحد یا رمز عبور اشتباه است!";
                        errEl.classList.remove('hidden');
                    } else {
                        await unlockDashboard(roomInput, pinInput, unitData.preset || 'full_suite');
                    }
                }
            } catch (e) {
                errEl.innerText = `خطای دیتابیس: ${e.message}`;
                errEl.classList.remove('hidden');
            }
        }

        async function unlockDashboard(roomId, pinCode, preset) {
            CURRENT_ROOM = roomId;
            currentPreset = preset;
            localStorage.setItem('KHABGAH_SESSION_V1', JSON.stringify({ roomId, pinCode }));
            document.getElementById('currentRoomDisplay').innerText = `واحد ${roomId}`;
            document.getElementById('authOverlay').style.display = 'none';
            await loadCloudData();
        }

        function logoutRoom() {
            localStorage.removeItem('KHABGAH_SESSION_V1');
            window.location.reload();
        }

        async function loadCloudData(showToastMsg = false) {
            if (!CURRENT_ROOM) return;
            const { data: memData } = await supabaseClient.from('members').select('*').eq('room_id', CURRENT_ROOM);
            members = (memData || []).map(m => ({ id: m.id, name: m.name, sleepZone: m.sleep_zone, points: m.points || 0, lastAreaIdx: m.last_area_idx || 0 }));

            const { data: taskData } = await supabaseClient.from('tasks').select('*').eq('room_id', CURRENT_ROOM);
            tasks = (taskData || []).map(t => ({ id: t.id, memberId: t.member_id, memberName: t.member_name, area: t.area, date: t.date, start: t.start_time, end: t.end_time, status: t.status }));

            renderAll();
            if (showToastMsg) showToast("اطلاعات بروزرسانی شد!", "🔄");
        }

        function renderZoneButtons() {
            document.getElementById('sleepZoneButtonsGrid').innerHTML = VALID_ZONES.map(z => `
                <button type="button" onclick="selectedSleepZone='${z}'; renderZoneButtons();" class="p-2 rounded-xl border text-xs font-bold ${selectedSleepZone===z?'bg-indigo-600 text-white border-indigo-400':'bg-slate-900 text-slate-300 border-slate-700'}">${z}</button>
            `).join('');
        }

        // تابع اصلاح‌شده افزودن عضو (بدون ارسال دستی id تا Supabase خودش بسازه)
        async function addMember() {
            const name = document.getElementById('memberNameInput').value.trim();
            if (!name) { showToast("نام عضو را وارد کنید!", "⚠️"); return; }
            
            const newMember = {
                room_id: CURRENT_ROOM,
                name: name,
                sleep_zone: selectedSleepZone,
                days_ago: 0,
                points: 0,
                last_area_idx: members.length
            };

            const { error } = await supabaseClient.from('members').insert([newMember]);
            if (error) {
                showToast(`خطا در ثبت عضو: ${error.message}`, "⚠️");
                return;
            }

            document.getElementById('memberNameInput').value = "";
            await loadCloudData();
            showToast("عضو جدید اضافه شد!", "👤");
        }

        async function deleteMember(id) {
            if (!confirm("آیا از حذف این عضو مطمئن هستید؟")) return;
            await supabaseClient.from('tasks').delete().eq('member_id', id).eq('room_id', CURRENT_ROOM);
            await supabaseClient.from('members').delete().eq('id', id).eq('room_id', CURRENT_ROOM);
            await loadCloudData();
            showToast("عضو حذف شد.", "🗑️");
        }

        // تابع اصلاح‌شده ثبت نوبت (بدون ارسال دستی id)
        async function handleTaskSubmission() {
            const memberId = parseInt(document.getElementById('memberSelect').value);
            const member = members.find(m => m.id === memberId);
            if (!member) { showToast("ابتدا یک عضو انتخاب کنید!", "⚠️"); return; }
            
            const area = document.getElementById('areaSelect').value;
            const date = document.getElementById('dateInput').value.trim();
            if (!date) { showToast("تاریخ را انتخاب کنید!", "⚠️"); return; }

            const newTask = {
                room_id: CURRENT_ROOM,
                member_id: memberId,
                member_name: member.name,
                sleep_zone: member.sleepZone,
                area: area,
                date: date,
                start_time: document.getElementById('startTimeInput').value,
                end_time: document.getElementById('endTimeInput').value,
                status: 'todo'
            };

            const { error } = await supabaseClient.from('tasks').insert([newTask]);
            if (error) {
                showToast(`خطا در ثبت نوبت: ${error.message}`, "⚠️");
                return;
            }

            await loadCloudData();
            showToast("نوبت ثبت شد!", "🚀");
        }

        async function deleteTask(id) {
            await supabaseClient.from('tasks').delete().eq('id', id).eq('room_id', CURRENT_ROOM);
            await loadCloudData();
            showToast("نوبت حذف شد.", "🗑️");
        }

        function renderAll() {
            document.getElementById('membersCountBadge').innerText = members.length;
            
            const mSelect = document.getElementById('memberSelect');
            if (mSelect) mSelect.innerHTML = members.length === 0 ? `<option value="">-- اول عضو اضافه کنید --</option>` : members.map(m => `<option value="${m.id}">${m.name} (${m.sleepZone})</option>`).join('');
            
            const aSelect = document.getElementById('areaSelect');
            if (aSelect) aSelect.innerHTML = (SPACE_PRESETS[currentPreset] ? SPACE_PRESETS[currentPreset].areas : ["آشپزخانه"]).map(a => `<option value="${a}">${a}</option>`).join('');

            // سیکل
            document.getElementById('cycleBar').innerHTML = members.length === 0 ? `<div class="col-span-full text-center py-4 text-xs text-slate-400">عضوی ثبت نشده است.</div>` : members.map(m => `
                <div class="p-2.5 rounded-xl border bg-slate-900 border-slate-800 text-xs space-y-1">
                    <strong class="text-white">${m.name}</strong>
                    <div class="text-[10px] text-slate-400">${m.sleepZone}</div>
                </div>
            `).join('');

            // اعضا
            document.getElementById('membersGrid').innerHTML = members.length === 0 ? `<div class="col-span-full text-center py-4 text-xs text-slate-400">لیست اعضا خالی است.</div>` : members.map(m => `
                <div class="bg-slate-900 border p-2.5 rounded-xl text-xs flex justify-between items-center">
                    <div><strong class="text-white block">${m.name}</strong><span class="text-[10px] text-indigo-300">${m.sleepZone}</span></div>
                    <button onclick="deleteMember(${m.id})" class="text-rose-400 hover:text-rose-300 p-1 font-bold">🗑️</button>
                </div>
            `).join('');

            // نوبت‌ها
            const todo = tasks.filter(t => t.status === 'todo');
            document.getElementById('todoCount').innerText = todo.length;
            document.getElementById('todoContainer').innerHTML = todo.length === 0 ? `<div class="text-center py-4 text-xs text-slate-500">نوبتی نیست.</div>` : todo.map(t => `
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-1 text-xs">
                    <div class="flex justify-between font-bold text-white"><span>${t.memberName} (${t.area})</span><button onclick="deleteTask(${t.id})" class="text-rose-400">حذف</button></div>
                    <div class="text-slate-400">📅 ${t.date} | ⏰ ${t.start} تا ${t.end}</div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            ['board', 'members', 'ranking'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "py-2 rounded-xl text-slate-400 text-xs font-bold flex flex-col items-center gap-0.5 transition";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold flex flex-col items-center gap-0.5 transition shadow-lg";
        }

        function showToast(msg, icon = "✨") {
            const t = document.getElementById('toast');
            document.getElementById('toastText').innerText = msg;
            document.getElementById('toastIcon').innerText = icon;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        function toggleDrawer(drawerId, iconId) {
            const d = document.getElementById(drawerId);
            const i = document.getElementById(iconId);
            d.classList.toggle('hidden');
            i.innerText = d.classList.contains('hidden') ? '▼ باز کردن' : '▲ بستن';
        }

        function init24HourTimeSelectors() {
            const startSel = document.getElementById('startTimeInput');
            const endSel = document.getElementById('endTimeInput');
            if(!startSel || !endSel) return;
            let html = '';
            for (let h = 0; h < 24; h++) {
                for (let m of ['00', '30']) {
                    const t = `${String(h).padStart(2, '0')}:${m}`;
                    html += `<option value="${t}">${t}</option>`;
                }
            }
            startSel.innerHTML = html; endSel.innerHTML = html;
            startSel.value = "16:00"; endSel.value = "18:00";
        }

        function changeSpacePreset() {
            currentPreset = document.getElementById('spacePresetSelect').value;
            renderAll();
        }

        init24HourTimeSelectors();
        renderZoneButtons();

        // بررسی لاگین خودکار قبلی
        const savedSession = localStorage.getItem('KHABGAH_SESSION_V1');
        if (savedSession) {
            try {
                const { roomId, pinCode } = JSON.parse(savedSession);
                if (roomId && pinCode) {
                    document.getElementById('authRoomInput').value = roomId;
                    document.getElementById('authPinInput').value = pinCode;
                    handleRoomAuth();
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
